[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chappie-trader"
version = "0.1.0"
description = "Modular trading agent and future Chappie financial core"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "exchange_calendars>=4.11",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
chappie = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "historical: M4.10/Stage 4 forensic or one-shot experiment regression; excluded from MVP readiness",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "logs*", "tests*"]
